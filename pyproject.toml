[project]
name = "dsp391m"
version = "0.1.0"
description = ""
authors = [
    {name = "OiHuecuata",email = "04122005truongtuan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3 (==1.43.111)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "playwright (>=1.63.0,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "confluent-kafka (>=2.12.0,<3.0.0)",
    "jsonschema (>=4.25.0,<5.0.0)",
    "pyspark (==4.0.2)",
    "delta-spark (==4.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "black (>=26.5.1,<27.0.0)"
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

# Overlay the root Compose file; keep the dsp391m project/network/metadata volume.
x-superset: &superset
  image: dsp391m-superset:6.0.0-eda1
  build:
    context: .
    dockerfile: infra/superset/Dockerfile
  profiles: [superset]
  environment:
    SUPERSET_CONFIG_PATH: /app/dsp-superset/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Run make superset-up to prepare local credentials}
    SUPERSET_METADATA_PASSWORD: ${SUPERSET_METADATA_PASSWORD:?Local metadata password required}
    SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-dsp_eda_admin}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Local admin password required}
    SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-eda@localhost.invalid}
    SUPERSET_CLICKHOUSE_USER: ${SUPERSET_CLICKHOUSE_USER:-dsp_superset_eda}
    SUPERSET_CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD:?Read-only ClickHouse password required}
    CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-dsp391m}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    FLASK_APP: superset
    PYTHONPATH: /app/dsp-superset
  volumes:
    - ./infra/superset:/app/dsp-superset:ro
    - ./docs/eda:/app/eda:ro
    - ./configs/reference:/app/reference:ro
    - ./.local/superset/config:/app/local-config:ro
    - ./.local/superset/runtime:/app/eda-runtime
  depends_on:
    superset-db:
      condition: service_healthy
    superset-cache:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  clickhouse:
    volumes:
      - ./.local/superset/config/clickhouse_eda.xml:/etc/clickhouse-server/users.d/dsp_eda.xml:ro
  superset-db:
    image: postgres:16.13-bookworm
    profiles: [superset]
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_DB: superset
      POSTGRES_PASSWORD_FILE: /run/secrets/metadata_password
    volumes:
      - superset-metadata:/var/lib/postgresql/data
      - ./.local/superset/config/metadata_password:/run/secrets/metadata_password:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset", "-d", "superset"]
      interval: 5s
      timeout: 5s
      retries: 20
  superset-cache:
    image: redis:7.2-alpine
    profiles: [superset]
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  superset-init:
    <<: *superset
    command: [sh, /app/dsp-superset/init.sh]
  superset:
    <<: *superset
    restart: unless-stopped
    command: [gunicorn, --bind, "0.0.0.0:8088", --workers, "2", --threads, "4", --timeout, "120", "superset.app:create_app()"]
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-db:
        condition: service_healthy
      superset-cache:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 24

volumes:
  superset-metadata:
